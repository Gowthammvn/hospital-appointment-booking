<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Admin Dashboard')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <h1 class="h3 mb-4">Admin Dashboard</h1>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3">
            <div class="card stat-card shadow-sm"><div class="card-body">
                <div class="text-muted small">Doctors</div><div class="display-6" th:text="${doctorCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card shadow-sm"><div class="card-body">
                <div class="text-muted small">Patients</div><div class="display-6" th:text="${patientCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card shadow-sm"><div class="card-body">
                <div class="text-muted small">Departments</div><div class="display-6" th:text="${departmentCount}">0</div>
            </div></div>
        </div>
        <div class="col-6 col-lg-3">
            <div class="card stat-card shadow-sm"><div class="card-body">
                <div class="text-muted small">Appointments today</div><div class="display-6" th:text="${stats['today']}">0</div>
            </div></div>
        </div>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <span class="badge text-bg-warning">Pending</span> <span class="h5 ms-2" th:text="${stats['pending']}">0</span>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <span class="badge text-bg-primary">Confirmed</span> <span class="h5 ms-2" th:text="${stats['confirmed']}">0</span>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <span class="badge text-bg-success">Completed</span> <span class="h5 ms-2" th:text="${stats['completed']}">0</span>
        </div></div></div>
        <div class="col-6 col-lg-3"><div class="card shadow-sm"><div class="card-body">
            <span class="badge text-bg-secondary">Cancelled</span> <span class="h5 ms-2" th:text="${stats['cancelled']}">0</span>
        </div></div></div>
    </div>

    <h2 class="h5 mb-3">All appointments (<span th:text="${stats['total']}">0</span>)</h2>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(appointments)}" class="p-5 text-center text-muted">No appointments yet.</div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(appointments)}">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr><th>#</th><th>Date</th><th>Time</th><th>Patient</th><th>Doctor</th><th>Department</th><th>NLP suggestion</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${appointments}">
                        <td th:text="${a.id}">1</td>
                        <td th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}">date</td>
                        <td th:text="${#temporals.format(a.appointmentTime, 'hh:mm a')}">time</td>
                        <td th:text="${a.patient.fullName}">patient</td>
                        <td th:text="${a.doctor.name}">doctor</td>
                        <td th:text="${a.doctor.department.name}">dept</td>
                        <td class="small" th:text="${a.suggestedDepartment} ?: '-'">-</td>
                        <td><span th:replace="~{fragments/layout :: status(${a.status})}"></span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
