<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My Appointments')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="h3 mb-0">My Appointments</h1>
        <a th:href="@{/patient/book}" class="btn btn-primary"><i class="bi bi-plus-lg"></i> Book appointment</a>
    </div>
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <div th:if="${#lists.isEmpty(appointments)}" class="p-5 text-center text-muted">
                <i class="bi bi-calendar-x" style="font-size: 3rem"></i>
                <p class="mt-2">You have no appointments yet.</p>
            </div>
            <div class="table-responsive" th:unless="${#lists.isEmpty(appointments)}">
                <table class="table table-hover mb-0">
                    <thead class="table-light">
                    <tr>
                        <th>#</th><th>Date</th><th>Time</th><th>Doctor</th><th>Department</th>
                        <th>Symptoms</th><th>Status</th><th>Doctor notes</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="a : ${appointments}">
                        <td th:text="${a.id}">1</td>
                        <td th:text="${#temporals.format(a.appointmentDate, 'dd MMM yyyy')}">01 Jan 2026</td>
                        <td th:text="${#temporals.format(a.appointmentTime, 'hh:mm a')}">10:00 AM</td>
                        <td th:text="${a.doctor.name}">Dr. X</td>
                        <td th:text="${a.doctor.department.name}">Dept</td>
                        <td class="small text-muted symptom-text">
                            <span th:text="${a.symptoms}"></span>
                            <div th:if="${a.suggestedDepartment}" class="text-primary">
                                <i class="bi bi-robot"></i> Suggested: <span th:text="${a.suggestedDepartment}"></span>
                            </div>
                        </td>
                        <td><span th:replace="~{fragments/layout :: status(${a.status})}"></span></td>
                        <td class="small" th:text="${a.doctorNotes}"></td>
                        <td>
                            <form th:if="${a.status.name() == 'PENDING' or a.status.name() == 'CONFIRMED'}"
                                  th:action="@{/patient/appointments/{id}/cancel(id=${a.id})}" method="post"
                                  onsubmit="return confirm('Cancel this appointment?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Cancel</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
